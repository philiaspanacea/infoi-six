<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Conditionals</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="battle">
      <div class="hitbox">
        <img class="pokemon" src="images/snorlax.png" alt="Snorlax" />
      </div>
      <button class="attack"><p>Attack!</p></button>
    </div>
    <div class="output">
      <div class="dmgBox">
        <p>Damage:</p>
        <p class="dmgOutput"></p>
      </div>

      <div class="hpBox">
        <p>Health:</p>
        <p class="hpOutput"></p>
      </div>
    </div>
    <!-- <div class="effect"></div> -->
    <script src="js/script.js"></script>
  </body>
</html>
